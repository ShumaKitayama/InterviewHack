# DesignDocument/14_CICDDesign.md 14.6.2 本番デプロイ（手動承認必須）
name: CD Production

on:
  workflow_dispatch:

jobs:
  deploy-backend-prod:
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg RELEASE=${{ github.sha }} \
            -t interviewhack-backend:${{ github.sha }} .

      # TODO: Push to Artifact Registry / GCR
      # TODO: Deploy to Cloud Run (service-prod)
      # TODO: Run DB migrations (idempotent)

      - name: Smoke test placeholder
        run: echo "TODO - curl health endpoint on prod"

  deploy-frontend-prod:
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          VITE_APP_ORIGIN: ${{ secrets.PROD_APP_ORIGIN }}

      # TODO: Deploy to Cloudflare Pages (prod)

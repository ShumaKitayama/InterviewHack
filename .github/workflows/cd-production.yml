# DesignDocument/14_CICDDesign.md 14.6.1 本番デプロイ（手動承認必須）/ 14.7 シークレット / 14.10 ロールバック
# 順序：DB マイグレーション → Docker build・push → Cloud Run デプロイ → スモークテスト（失敗時は直前のリビジョンへ戻す）
#
# 事前に GitHub の Environment「prod」に次を登録する（README の「本番デプロイ」を参照）
#   手動承認：Actions からこのワークフローを実行する（無料プランでは Required reviewers が使えない。14.6.1）
#   Secrets  ：PROD_DATABASE_URL（マイグレーション用。Neon main ブランチ）
#   Variables：GCP_PROJECT_ID / GCP_REGION / GCP_WIF_PROVIDER / GCP_DEPLOY_SERVICE_ACCOUNT /
#              GCP_ARTIFACT_REPOSITORY / CLOUD_RUN_SERVICE / CLOUD_RUN_DATABASE_URL_SECRET /
#              FIREBASE_PROJECT_ID / SHARE_BASE_URL
name: CD Production

on:
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy-backend-prod:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write # Workload Identity Federation（14.7.1）
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/interviewhack-api:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # 14.6.1 の 0：コストガードで停止中（手動スケーリング 0）ならデプロイしない。再開は人が判断する（12.12.6）
      - name: Check the API is not stopped by the cost guard
        run: |
          STATE=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" --region "${{ vars.GCP_REGION }}" \
            --format json 2>/dev/null | python3 -c 'import json,sys; a=json.load(sys.stdin).get("metadata",{}).get("annotations",{}); print("stopped" if a.get("run.googleapis.com/scalingMode")=="manual" and a.get("run.googleapis.com/manualInstanceCount","0")=="0" else "running")' || echo running)
          echo "service state: ${STATE}"
          if [ "$STATE" = "stopped" ]; then
            echo "::error::The API is stopped by the cost guard. Resume it manually first (DesignDocument/12_Operation.md 12.12.6)."
            exit 1
          fi

      # 14.10.1：失敗時に戻す先を、デプロイ前に記録する（初回デプロイでは空）
      - name: Record current revision
        id: previous
        run: |
          REVISION=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --region "${{ vars.GCP_REGION }}" --format 'value(status.latestReadyRevisionName)' 2>/dev/null || true)
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          echo "previous revision: ${REVISION:-<none>}"

      # 1. DB マイグレーション（後方互換かつ冪等。12.4）
      - name: Install psql
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client

      - name: Migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: bash backend/scripts/migrate.sh

      # 2. Docker build → Artifact Registry に push（Git SHA でタグ付け。14.9）
      - name: Build and push image
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build --build-arg RELEASE=${{ github.sha }} -t "$IMAGE" backend
          docker push "$IMAGE"

      # 3. Cloud Run（service-prod）へデプロイ。DATABASE_URL は Secret Manager から渡す（14.7.2 / 14.8.1）
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          # 実行用サービスアカウントはサービスと同名（ops/costguard/scripts/setup.sh が作る。12.12.5）
          flags: --allow-unauthenticated --max-instances=1 --service-account=${{ vars.CLOUD_RUN_SERVICE }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          env_vars: |
            APP_ENV=prod
            LOG_LEVEL=info
            RELEASE=${{ github.sha }}
            FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
            SHARE_BASE_URL=${{ vars.SHARE_BASE_URL }}
            FEATURE_SHARE_VIEW=on
            FEATURE_SHARE_CREATE=on
          secrets: |
            DATABASE_URL=${{ vars.CLOUD_RUN_DATABASE_URL_SECRET }}:latest

      # 4. スモークテスト（14.6.1 / 14.11）
      - name: Smoke test
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          check() {
            local path="$1" expected="$2" actual
            actual=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${SERVICE_URL}${path}")
            echo "GET ${path} -> ${actual} (expected ${expected})"
            [ "$actual" = "$expected" ]
          }
          # Neon のコールドスタートを考慮して /health は数回まで待つ
          for i in 1 2 3 4 5; do check /health 200 && break || { [ "$i" = 5 ] && exit 1; sleep 5; }; done
          check /s/smoke-test-nonexistent-token 404
          check /me 401
          # 14.11：prod のサービスに APP_ENV=prod が入っていること（値以外は出さない）
          APP_ENV_VALUE=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" --region "${{ vars.GCP_REGION }}" \
            --format json | python3 -c 'import json,sys; env=json.load(sys.stdin)["spec"]["template"]["spec"]["containers"][0].get("env", []); print(next((e.get("value","") for e in env if e["name"]=="APP_ENV"), ""))')
          echo "APP_ENV=${APP_ENV_VALUE}"
          [ "$APP_ENV_VALUE" = "prod" ]

      # 14.10.1：失敗したら直前のリビジョンへトラフィックを戻す
      - name: Roll back on failure
        if: failure() && steps.previous.outputs.revision != ''
        run: |
          gcloud run services update-traffic "${{ vars.CLOUD_RUN_SERVICE }}" \
            --region "${{ vars.GCP_REGION }}" \
            --to-revisions "${{ steps.previous.outputs.revision }}=100"

# DesignDocument/14_CICDDesign.md 14.6.1 ステージングデプロイ
name: CD Staging

on:
  push:
    branches: [main]

jobs:
  deploy-backend-stg:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg RELEASE=${{ github.sha }} \
            -t interviewhack-backend:${{ github.sha }} .

      # TODO: Push to Artifact Registry / GCR
      # TODO: Deploy to Cloud Run (service-stg)
      # TODO: Run DB migrations (idempotent)

      - name: Smoke test placeholder
        run: echo "TODO - curl health endpoint on stg"

  deploy-frontend-stg:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.STG_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STG_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.STG_API_BASE_URL }}
          VITE_APP_ORIGIN: ${{ secrets.STG_APP_ORIGIN }}

      # TODO: Deploy to Cloudflare Pages (stg)

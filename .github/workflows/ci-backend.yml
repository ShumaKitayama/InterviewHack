# DesignDocument/14_CICDDesign.md 14.5.2 バックエンド CI
name: CI Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -count=1

      - name: Architecture Check (Domain layer purity)
        run: bash scripts/arch_check.sh

      - name: Build
        run: go build -o /dev/null ./cmd/api

      - name: Docker Build
        run: docker build --build-arg RELEASE=${{ github.sha }} -t interviewhack-backend:ci .

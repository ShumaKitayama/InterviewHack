# DesignDocument/14_CICDDesign.md 14.5.1 バックエンド CI / 14.5 共通ゲート
name: CI Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interviewhack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/interviewhack_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Architecture check (7.2.1)
        run: bash scripts/arch_check.sh

      # 14.5.1：マイグレーションを 2 回適用し、冪等であることを確認する
      - name: Migrate (1st)
        run: DATABASE_URL="$TEST_DATABASE_URL" bash scripts/migrate.sh
      - name: Migrate (2nd, idempotency)
        run: DATABASE_URL="$TEST_DATABASE_URL" bash scripts/migrate.sh

      # ユニットテストと統合テスト（TEST_DATABASE_URL があると internal/app の統合テストも実行される）
      - name: Test
        run: go test ./... -count=1 -coverpkg=./internal/... -coverprofile=coverage.out

      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        run: go build -o /dev/null ./cmd/api

      - name: Docker build
        run: docker build --build-arg RELEASE=${{ github.sha }} -t interviewhack-backend:ci .

      # 14.5 共通ゲート / 14.9：成果物に RELEASE=Git SHA が埋め込まれていること
      - name: Verify RELEASE in image
        run: |
          docker create --name release-check interviewhack-backend:ci
          docker cp release-check:/app/server ./server-bin
          docker rm release-check
          grep -a -q "${{ github.sha }}" ./server-bin

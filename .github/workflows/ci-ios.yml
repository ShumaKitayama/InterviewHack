# DesignDocument/14_CICDDesign.md 14.5.2 iOS CI（ios/ 変更時のみ、署名なし、シミュレータでテスト）
name: CI iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ci-ios.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # 5.12.2：本物の plist はコミットしない。テスト用に、公開されても問題ない形式だけのダミーを作る
      - name: Create placeholder GoogleService-Info-Dev.plist
        run: |
          cat > App/Resources/GoogleService-Info-Dev.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>AIzaSyCI000000000000000000000000000000</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>BUNDLE_ID</key><string>jp.interviewhack.app.dev</string>
            <key>PROJECT_ID</key><string>interviewhack-ci</string>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_GCM_ENABLED</key><false/>
            <key>IS_SIGNIN_ENABLED</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test (simulator, no signing)
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcodebuild test \
            -project InterviewHack.xcodeproj \
            -scheme InterviewHack \
            -configuration Debug-Dev \
            -destination "id=${DEVICE_ID}" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

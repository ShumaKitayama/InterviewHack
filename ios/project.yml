# XcodeGen の定義（DesignDocument/5_FrontendDesign.md 5.3 / 5.12、14_CICDDesign.md）
# 生成：cd ios && xcodegen generate  →  InterviewHack.xcodeproj（コミットしない）
name: InterviewHack
options:
  bundleIdPrefix: jp.interviewhack
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
configs:
  Debug-Dev: debug
  Release-Prod: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  InterviewHackKit:
    path: InterviewHackKit
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
targets:
  InterviewHack:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - "*.plist"
          - README.md
    configFiles:
      Debug-Dev: App/Config/Dev.xcconfig
      Release-Prod: App/Config/Prod.xcconfig
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: InterviewHackKit
        product: InterviewHackKit
      - package: InterviewHackKit
        product: InterviewHackUI
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
    postBuildScripts:
      # 5.12.2：構成に応じた GoogleService-Info を GoogleService-Info.plist としてコピーする
      - name: Copy GoogleService-Info.plist
        basedOnDependencyAnalysis: false
        script: |
          SOURCE="${SRCROOT}/App/Resources/${GOOGLE_SERVICE_INFO_PLIST}"
          if [ ! -f "$SOURCE" ]; then
            echo "error: ${SOURCE} がありません。App/Resources/README.md を参照してください"
            exit 1
          fi
          cp "$SOURCE" "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/GoogleService-Info.plist"
  InterviewHackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    dependencies:
      - target: InterviewHack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  InterviewHack:
    build:
      targets:
        InterviewHack: all
    run:
      config: Debug-Dev
    test:
      config: Debug-Dev
      targets:
        - InterviewHackTests
        - package: InterviewHackKit/InterviewHackKitTests
    archive:
      config: Release-Prod

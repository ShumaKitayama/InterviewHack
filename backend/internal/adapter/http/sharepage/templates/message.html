{{define "message.html"}}<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}}</title>
{{template "style"}}
</head>
<body>
<main>
<h1>{{.Title}}</h1>
<p>{{.Message}}</p>
</main>
</body>
</html>{{end}}
{{define "style"}}<style>
:root { color-scheme: light dark; --fg: #1d1d1f; --bg: #ffffff; --muted: #6e6e73; --line: #d2d2d7; }
@media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --bg: #1c1c1e; --muted: #a1a1a6; --line: #3a3a3c; } }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.8; }
main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
.label { color: var(--muted); font-size: 14px; margin: 0; }
h1 { font-size: 24px; margin: 4px 0 24px; }
h2 { font-size: 18px; margin: 0 0 8px; }
section { border-top: 1px solid var(--line); padding: 20px 0; }
section p { margin: 0 0 8px; white-space: pre-wrap; word-break: break-word; }
footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; }
</style>{{end}}
